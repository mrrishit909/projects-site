name: live-site-check

# Verifies every published project site listed in docs/program/release-manifest.json from a
# GitHub-hosted runner (the cloud coordinator's network policy cannot reach *.github.io):
# first waits until the live data manifest carries the release commit (so a check never races the Pages deployment), then
# HTTP status on every route the site declares in routes.json, a real browser journey with
# screenshots, and the portfolio link in both directions (P0x-REL-09/17/18, master 21).
on:
  push:
    branches: [business-data-lab]
    paths:
      - "docs/program/release-manifest.json"
      - ".github/workflows/live-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sites:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          echo "matrix=$(python3 -c "import json;print(json.dumps([{'slug':s['slug'],'url':s['site_url'],'sha':s['source_commit_business_data_lab']} for s in json.load(open('docs/program/release-manifest.json'))['sites']]))")" >> "$GITHUB_OUTPUT"

  live:
    needs: sites
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.sites.outputs.matrix) }}
    env:
      SLUG: ${{ matrix.site.slug }}
      BASE: ${{ matrix.site.url }}
      EXPECTED_SHA: ${{ matrix.site.sha }}
    steps:
      - name: Runner identity (must be GitHub-hosted)
        run: test "${{ runner.environment }}" = "github-hosted"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait until the live manifest carries the release commit (Pages deployment and CDN propagation)
        run: |
          mkdir -p live-evidence
          for i in $(seq 1 24); do
            live=$(curl -sS -H 'Cache-Control: no-cache' "${BASE}data/manifest.json?t=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin).get('code_sha',''))" || true)
            echo "attempt $i live code_sha=$live expected=$EXPECTED_SHA" | tee -a live-evidence/deploy-wait.txt
            [ "$live" = "$EXPECTED_SHA" ] && exit 0
            sleep 15
          done
          echo "live site never reached the release commit" | tee -a live-evidence/deploy-wait.txt
          exit 1
      - name: HTTP checks on every declared route, the data manifest and the case study link
        run: |
          mkdir -p live-evidence
          curl -sS -f "${BASE}routes.json" -o live-evidence/routes.json
          for p in $(python3 -c "import json;print(' '.join(r if r else '.' for r in json.load(open('live-evidence/routes.json'))['routes']))") "data/manifest.json"; do
            [ "$p" = "." ] && p=""
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$p")
            echo "$code $BASE$p" | tee -a live-evidence/http.txt
            test "$code" = "200"
          done
          curl -sS "${BASE}data/manifest.json" | tee live-evidence/manifest.json | head -c 400; echo
          case_url="https://mrrishit909.github.io/projects-site/$SLUG/"
          code=$(curl -sS -o live-evidence/case.html -w '%{http_code}' "$case_url"); echo "$code $case_url" | tee -a live-evidence/http.txt
          if [ "$code" = "200" ]; then
            grep -q "labs/$SLUG/" live-evidence/case.html && echo "case study links to the site" | tee -a live-evidence/http.txt
          else
            echo "case study not published yet (status $code)" | tee -a live-evidence/http.txt
          fi
          curl -sS -o live-evidence/site.html "$BASE"
          grep -q "mrrishit909.github.io/projects-site/" live-evidence/site.html && echo "site links back to the portfolio" | tee -a live-evidence/http.txt
      - name: Browser screenshots and journey (first two routes after the root)
        timeout-minutes: 6
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null
          node - <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");
          (async () => {
            const base = process.env.BASE;
            const routes = JSON.parse(fs.readFileSync("live-evidence/routes.json", "utf8")).routes.filter(r => r).slice(0, 2);
            const browser = await chromium.launch();
            setTimeout(() => { console.error("global timeout"); process.exit(2); }, 240000).unref();
            const errors = [];
            for (const [w, h, name] of [[360, 780, "mobile"], [1280, 800, "desktop"]]) {
              const page = await browser.newPage({ viewport: { width: w, height: h } });
              page.on("console", m => { if (m.type() === "error") errors.push(`${name}: ${m.text()}`); });
              page.on("pageerror", e => errors.push(`${name}: ${e.message}`));
              for (const r of routes) {
                await page.goto(base + r, { waitUntil: "load", timeout: 45000 });
                await page.waitForSelector("main table, main svg, main h1", { timeout: 45000 });
                await page.screenshot({ path: `live-evidence/live-${r.replace(/\//g, "")}-${name}.png`, fullPage: true });
                fs.appendFileSync("live-evidence/journey.txt", `${name} ${r}: title="${await page.title()}" url=${page.url()} scrollWidth=${await page.evaluate(() => document.scrollingElement.scrollWidth)} innerWidth=${w}\n`);
              }
              await page.close();
            }
            await browser.close();
            fs.writeFileSync("live-evidence/console-errors.json", JSON.stringify(errors, null, 2));
            if (errors.length) { console.error(errors); process.exit(1); }
          })();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ matrix.site.slug }}-${{ github.run_id }}
          path: live-evidence
          retention-days: 90
