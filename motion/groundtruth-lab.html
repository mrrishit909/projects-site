  apL.forEach((el, j) => place(el, narrow ? X / 2 + 0.5 : -X / 2 - 0.35, 0, Z / 2 - (j + 0.5) * RD, narrow ? -50 : -100, narrow ? 0 : -50, apA * (narrow && j % 2 && j > 0 ? 0 : 1)));
