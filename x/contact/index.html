<script type="module">
// Tampa clock, America/New_York; the zone label shows EST or EDT
const clock = document.getElementById("clock"), tz = document.getElementById("tz");
const fmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23", timeZoneName: "short" });
const tick = () => {
  const p = Object.fromEntries(fmt.formatToParts(new Date()).map((x) => [x.type, x.value]));
  clock.textContent = `${p.hour}:${p.minute}:${p.second}`; clock.dateTime = `${p.hour}:${p.minute}:${p.second}`; tz.textContent = p.timeZoneName;
};
tick(); setInterval(tick, 1000);

// copy e-mail with an announced status; falls back to a selection prompt when the clipboard is blocked
const btn = document.querySelector(".copy"), status = document.querySelector(".status");
let t;
btn.addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(btn.dataset.copy); status.textContent = "E-mail copied to clipboard"; btn.textContent = "Copied"; btn.dataset.done = ""; window.xSound?.blip(1320); }
  catch { status.textContent = "Copy blocked, select the address above"; }
  clearTimeout(t); t = setTimeout(() => { btn.textContent = "Copy"; delete btn.dataset.done; status.textContent = ""; }, 2600);
});
</script>
